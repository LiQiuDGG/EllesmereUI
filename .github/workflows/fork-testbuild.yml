# Fork-only test build. Upstream releases on tag push via .github/workflows/release.yml,
# which uploads to CurseForge and Wago using secrets this fork does not have. This one
# packages a branch and attaches the zip to a rolling GitHub prerelease, so a
# work-in-progress branch can be installed and tested before it is proposed upstream.
#
# Install with:  gh release download testbuild --repo LiQiuDGG/EllesmereUI
#
# This file must stay on main. Keeping it off feature branches keeps it out of PR diffs.
name: Fork Test Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: true
        default: feature/bag-bank-column-count

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # -d skips every upload, so no CurseForge or Wago token is involved.
      - uses: BigWigsMods/packager@6d50adb6e8517eefef63f4afb16a6518166a6b28 # v2.5.1
        with:
          args: -d

      # One rolling "testbuild" release, replaced each run, so the download
      # command never changes no matter which branch was built.
      - name: Publish the zip to the testbuild release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete testbuild --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create testbuild .release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Test build: ${{ inputs.ref }}" \
            --notes "Unofficial build of \`${{ inputs.ref }}\` for local testing. Not affiliated with upstream EllesmereUI. Built $(date -u '+%Y-%m-%d %H:%M UTC') from $(git rev-parse --short HEAD)."
